mcs.metadata:
  componentName: Start der Unterhaltung
  description: Dieses Systemthema wird ausgelöst, wenn der Agent eine Aktivität empfängt, die auf den Beginn einer neuen Unterhaltung hindeutet. Wenn Sie nicht möchten, dass der Agent die Unterhaltung beginnt, deaktivieren Sie dieses Thema.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - Willkommen beim technischen Service der Firma AIRCO Systems GmbH. Ich bin der digitale Service-Assistent. Zur Bearbeitung Ihres Anliegens wird dieses Gespräch mittels KI verarbeitet.
        speak:
          - Willkommen beim technischen Service der Firma <sub alias="Airko">AIRCO</sub> Systems GmbH. Sie sprechen mit unserem digitalen Service-Assistenten. Zur Bearbeitung Ihres Anliegens wird dieses Gespräch transkribiert und verarbeitet.
        allowBargeIn: false

    - kind: Question
      id: question_9fI3eo
      interruptionPolicy:
        allowInterruption: false

      variable: Topic.Sprachwahl
      prompt:
        text:
          - Für Deutsch geben Sie bitte die 1 ein, für Englisch die 2. For English, please enter 2.
        speak:
          - Für Deutsch drücken Sie die Eins. For English, press two.
        allowBargeIn: true

      entity:
        kind: ClosedListEntityReference
        sensitivityLevel: None
        entityId: mosaiic_AIRCOTelefonBot.entity.Sprachwahl
        selectedItems:
          - id: deutsch
            dtmfKey: Num1

          - id: englisch
            dtmfKey: Num2

        dtmfMultipleChoiceOptions:
          generateMapping: true
          readOutOptions: false

      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.Kundendatenerfassen
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.Kundendatenerfassen

    - kind: ConditionGroup
      id: conditionGroup_FDLIaV
      conditions:
        - id: conditionItem_P810UA
          condition: =Topic.Sprachwahl = 'mosaiic_AIRCOTelefonBot.entity.Sprachwahl'.englisch
          displayName: Englisch gewählt
          actions:
            - kind: SetMultipleVariables
              id: setVariable_aym5pY
              assignments:
                - variable: System.User.Language
                  value:
                    kind: OptionDataValue
                    type:
                      kind: SystemOptionSet
                      name: Locale

                    value: English

                - variable: Global.Sprache
                  value: Englisch

            - kind: BeginDialog
              id: Q7RLUY
              dialog: mosaiic_AIRCOTelefonBot.topic.KundendatenerfassenEN

      elseActions:
        - kind: SetMultipleVariables
          id: Rleb8T
          assignments:
            - variable: System.User.Language
              value:
                kind: OptionDataValue
                type:
                  kind: SystemOptionSet
                  name: Locale

                value: German

            - variable: Global.Sprache
              value: Deutsch

        - kind: BeginDialog
          id: heIXod
          dialog: mosaiic_AIRCOTelefonBot.topic.Kundendatenerfassen