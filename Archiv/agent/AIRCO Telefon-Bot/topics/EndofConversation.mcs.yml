mcs.metadata:
  componentName: Ende der Unterhaltung
  description: |-
    Dieses Systemthema wird nur durch eine Umleitungsaktion ausgelöst
    und führt den Benutzer durch die Bewertung seiner Unterhaltung mit dem Agent.
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnSystemRedirect
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_safetyNet
      conditions:
        - id: conditionItem_hasPhone
          condition: =Not(IsBlank(Global.Telefonnummer)) && Not(Global.FlowAufgerufen)
          actions:
            - kind: SetVariable
              id: setVariable_vZO64V
              variable: Global.FlowAufgerufen
              value: =true

            - kind: InvokeFlowAction
              id: OZFphC
              input:
                binding:
                  text: =Global.Firmenname
                  text_1: =Global.Ansprechpartner
                  text_2: =Global.Telefonnummer
                  text_3: =Global.Anliegen
                  text_4: =Global.KanalLabel
                  text_5: =Global.Anlage
                  text_6: =If(IsBlank(Global.Anrufgrund), Text(Global.AnrufgrundEN), Text(Global.Anrufgrund))
                  text_7: =System.Conversation.Id

              output: {}
              flowId: 834c8025-3da8-f111-b8dd-70a8a52f67fc

            - kind: ConditionGroup
              id: conditionGroup_endSprache
              conditions:
                - id: conditionItem_endSpracheEN
                  condition: =Global.Sprache = "Englisch"
                  actions:
                    - kind: SendActivity
                      id: BsLiWe_en
                      activity:
                        text:
                          - Thank you. I have forwarded your request. A member of our team will contact you shortly. Goodbye.
                        speak:
                          - Thank you. I have forwarded your request. A member of our team will contact you shortly. Goodbye.

              elseActions:
                - kind: SendActivity
                  id: BsLiWe
                  activity:
                    text:
                      - Vielen Dank, ich habe Ihr Anliegen weitergeleitet. Ein Mitarbeiter wird sich zeitnah bei Ihnen melden. Auf Wiederhören!
                    speak:
                      - Vielen Dank, ich habe Ihr Anliegen weitergeleitet. Ein Mitarbeiter wird sich zeitnah bei Ihnen melden. Auf Wiederhören!

    - kind: EndConversation
      id: endConversation_1
