mcs.metadata:
  componentName: Kundendaten erfassen EN
kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: Question
      id: question_qMVPee_en
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Firmenname
      prompt:
        text:
          - Which company are you calling for?
        speak:
          - Which company are you calling for?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: question_H0ONs7_en
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Ansprechpartner
      prompt:
        text:
          - May I have your name, please?
        speak:
          - May I have your name, please?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: 9CvROV_en
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Telefonnummer
      prompt:
        text:
          - At which number can we reach you?
        speak:
          - What is your phone number?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: U6OTmJ_en
      interruptionPolicy:
        allowInterruption: false

      variable: Global.AnrufgrundEN
      prompt:
        text:
          - |-
            What is the reason for your call?
            1 - Malfunction
            2 - Schedule a maintenance appointment
            3 - Spare parts order
            4 - Request a callback
            5 - Something else
        speak:
          - "What is the reason for your call? You can say: malfunction, maintenance appointment, spare parts order, request a callback, or something else."
        allowBargeIn: false

      entity:
        kind: ClosedListEntityReference
        sensitivityLevel: None
        entityId: mosaiic_AIRCOTelefonBot.entity.AnrufgrundEN

      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: SetVariable
      id: 2wyZbs_en
      variable: Global.KanalLabel
      value: Telefon

    - kind: ConditionGroup
      id: conditionGroup_DklHkA_en
      conditions:
        - id: conditionItem_8IyZXO_en
          condition: =Global.AnrufgrundEN = 'mosaiic_AIRCOTelefonBot.entity.AnrufgrundEN'.'8jiEHk' || Global.AnrufgrundEN = 'mosaiic_AIRCOTelefonBot.entity.AnrufgrundEN'.KXrpcq
          displayName: Störung oder Wartung > Anlage fragen
          actions:
            - kind: Question
              id: question_Xnm8Nm_en
              interruptionPolicy:
                allowInterruption: false

              variable: Global.Anlage
              prompt:
                text:
                  - Please tell us the system designation, the serial number and the year of manufacture.
                speak:
                  - Please tell us the system designation, the serial number and the year of manufacture.
                allowBargeIn: false

              entity:
                kind: StringPrebuiltEntity
                sensitivityLevel: None

              voiceInputSettings:
                fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                defaultValueMissingAction: GoToDialog

              holdSettings:
                kind: UserRequestedHoldSettings

              fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: question_RZHeKB_en
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Anliegen
      prompt:
        text:
          - Please describe your request now.
        speak:
          - Please describe your request now.
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: BeginDialog
      id: uFP7SX_en
      dialog: mosaiic_AIRCOTelefonBot.topic.ZusammenfassungEN

inputType: {}
outputType: {}