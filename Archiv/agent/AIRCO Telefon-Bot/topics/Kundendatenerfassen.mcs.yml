mcs.metadata:
  componentName: Kundendaten erfassen
kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: Question
      id: question_qMVPee
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Firmenname
      prompt:
        text:
          - Für welche Firma kontaktieren Sie uns?
        speak:
          - Für welche Firma rufen Sie an?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: question_H0ONs7
      interruptionPolicy:
        allowInterruption: false

      variable: init:Global.Ansprechpartner
      prompt:
        text:
          - Wie ist Ihr Name?
        speak:
          - Wie ist Ihr Name?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: 9CvROV
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Telefonnummer
      prompt:
        text:
          - Unter welcher Nummer können wir Sie erreichen?
        speak:
          - Wie ist Ihre Telefonnummer?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: U6OTmJ
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Anrufgrund
      prompt:
        text:
          - |-
            Was ist der Grund Ihres Anrufs?
            1 - Störung oder Problem
            2 - Wartungstermin vereinbaren
            3 - Ersatzteilbestellung
            4 - Rückrufbitte
            5 - Sonstiges
        speak:
          - "Was ist der Grund Ihres Anrufs? Sie können sagen: Störung oder Problem, Wartungstermin vereinbaren, Ersatzteilbestellung, Rückrufbitte, oder Sonstiges."
        allowBargeIn: false

      entity:
        kind: ClosedListEntityReference
        entityId: mosaiic_AIRCOTelefonBot.entity.Anrufgrund

      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: SetVariable
      id: 2wyZbs
      variable: Global.KanalLabel
      value: Telefon

    - kind: ConditionGroup
      id: conditionGroup_DklHkA
      conditions:
        - id: conditionItem_8IyZXO
          condition: =Global.Anrufgrund = 'mosaiic_AIRCOTelefonBot.entity.Anrufgrund'.u9xatS || Global.Anrufgrund = 'mosaiic_AIRCOTelefonBot.entity.Anrufgrund'.gShHbV
          displayName: Störung oder Wartung > Anlage fragen
          actions:
            - kind: Question
              id: question_Xnm8Nm
              interruptionPolicy:
                allowInterruption: false

              variable: Global.Anlage
              prompt:
                text:
                  - Bitte teilen Sie uns die Anlagenbezeichnung, Serialnummer und das Baujahr mit.
                speak:
                  - Bitte teilen Sie uns die Anlagenbezeichnung, Serialnummer und das Baujahr mit.
                allowBargeIn: false

              entity:
                kind: StringPrebuiltEntity
                sensitivityLevel: None

              voiceInputSettings:
                fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                defaultValueMissingAction: GoToDialog

              holdSettings:
                kind: UserRequestedHoldSettings
                holdPrompts:

              fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: InvokeFlowAction
      id: m8Ujcv
      displayName: Staging
      input:
        binding:
          text: =System.Conversation.Id
          text_1: =If(IsBlank(Global.Firmenname), "nicht angegeben", Global.Firmenname)
          text_2: =If(IsBlank(Global.Ansprechpartner), "nicht angegeben", Global.Ansprechpartner)
          text_3: =If(IsBlank(Global.Telefonnummer), "nicht angegeben", Global.Telefonnummer)
          text_4: =If(IsBlank(Global.Anrufgrund), "nicht angegeben", Text(Global.Anrufgrund))
          text_5: =If(IsBlank(Global.Anlage), "nicht erfasst", Global.Anlage)
          text_6: =If(IsBlank(Global.Anliegen), "nicht erfasst", Global.Anliegen)
          text_7: =If(IsBlank(Global.KanalLabel), "nicht angegeben", Global.KanalLabel)

      output: {}
      flowId: a0a99959-80a7-f111-b8de-7ced8d476627

    - kind: Question
      id: question_RZHeKB
      interruptionPolicy:
        allowInterruption: false

      variable: init:Global.Anliegen
      prompt:
        text:
          - Bitte beschreiben Sie nun Ihr Anliegen.
        speak:
          - Bitte beschreiben Sie nun Ihr Anliegen.
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: BeginDialog
      id: uFP7SX
      dialog: mosaiic_AIRCOTelefonBot.topic.Zusammenfassung-Slim

inputType: {}
outputType: {}