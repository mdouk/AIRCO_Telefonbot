mcs.metadata:
  componentName: Spracheingabe nicht erkannt
  description: Wird ausgelöst, wenn die Spracheingaben des Benutzers nicht erkannt werden können.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnrecognizedSpeech
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_unrecognizedSprache
      conditions:
        - id: conditionItem_unrecognizedSpracheEN
          condition: =Global.Sprache = "Englisch"
          actions:
            - kind: SendActivity
              id: sendActivity_26sT9O_en
              activity:
                text:
                  - Sorry, I didn't catch that. Could you repeat it, please?
                speak:
                  - Sorry, I didn't catch that. Could you repeat it, please?

      elseActions:
        - kind: SendActivity
          id: sendActivity_26sT9O
          activity:
            text:
              - Entschuldigung, ich habe das nicht richtig verstanden. Können Sie es bitte wiederholen?
            speak:
              - Entschuldigung, ich habe das nicht richtig verstanden. Können Sie es bitte wiederholen?