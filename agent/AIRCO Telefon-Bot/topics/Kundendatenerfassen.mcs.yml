mcs.metadata:
  componentName: Kundendaten erfassen
kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: Question
      id: question_qMVPee
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Firmenname
      prompt:
        text:
          - Für welche Firma kontaktieren Sie uns?
        speak:
          - Für welche Firma rufen Sie an?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: question_H0ONs7
      interruptionPolicy:
        allowInterruption: false

      variable: init:Global.Ansprechpartner
      prompt:
        text:
          - Wie ist Ihr Name?
        speak:
          - Wie ist Ihr Name?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: Question
      id: 9CvROV
      interruptionPolicy:
        allowInterruption: false

      variable: Global.Telefonnummer
      prompt:
        text:
          - Unter welcher Nummer können wir Sie erreichen?
        speak:
          - Wie ist Ihre Telefonnummer?
        allowBargeIn: false

      entity: StringPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: SetVariable
      id: 2X2Lbc
      variable: Global.KanalLabel
      value: Telefon

    - kind: BeginDialog
      id: lzTpPJ
      dialog: mosaiic_AIRCOTelefonBot.topic.Anrufgrunderfassen

inputType: {}
outputType: {}