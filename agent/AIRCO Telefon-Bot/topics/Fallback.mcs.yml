mcs.metadata:
  componentName: Fallback
  description: Dieses Systemthema wird ausgelöst, wenn die Äußerung des Benutzers mit keinem vorhandenen Thema übereinstimmt.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_fallbackSprache
      conditions:
        - id: conditionItem_fallbackSpracheEN
          condition: =Global.Sprache = "Englisch"
          actions:
            - kind: SendActivity
              id: sendActivity_edXoXa_en
              activity:
                text:
                  - I'm sorry, I didn't understand that. I'll go ahead and take down your request anyway.
                speak:
                  - I'm sorry, I didn't understand that. I'll go ahead and take down your request anyway.

            - kind: BeginDialog
              id: GqSwCg_en
              dialog: mosaiic_AIRCOTelefonBot.topic.AnliegenerfassenEN

      elseActions:
        - kind: SendActivity
          id: sendActivity_edXoXa
          activity:
            text:
              - Entschuldigung, das habe ich nicht richtig verstanden. Ich nehme Ihr Anliegen gerne trotzdem auf.
            speak:
              - Entschuldigung, das habe ich nicht richtig verstanden. Ich nehme Ihr Anliegen gerne trotzdem auf.

        - kind: BeginDialog
          id: GqSwCg
          dialog: mosaiic_AIRCOTelefonBot.topic.Anliegenerfassen