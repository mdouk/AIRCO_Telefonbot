mcs.metadata:
  componentName: Unbekannte Wähltastatureingabe
  description: Wird ausgelöst, wenn die Wähltastatureingaben eines Benutzers mit keinen vorhandenen Wähltastatureinstellungen übereinstimmen. Vor dem Auslösen dieses Triggers werden globale MFV-Wähltastaturkonfigurationen berücksichtigt.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownDtmfKey
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_dtmfSprache
      conditions:
        - id: conditionItem_dtmfSpracheEN
          condition: =Global.Sprache = "Englisch"
          actions:
            - kind: SendActivity
              id: sendActivity_26sT88_en
              activity: Sorry, I didn't catch that. Could you repeat it, please?

      elseActions:
        - kind: SendActivity
          id: sendActivity_26sT88
          activity: Entschuldigung, ich habe das nicht richtig verstanden. Können Sie es bitte wiederholen?