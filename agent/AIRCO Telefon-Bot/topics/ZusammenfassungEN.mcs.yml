mcs.metadata:
  componentName: Zusammenfassung EN
kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SetVariable
      id: setVariable_IgcdCf_en
      variable: Topic.Korrekturversuche
      value: =0

    - kind: InvokeFlowAction
      id: 2exxIi_en
      displayName: Staging
      input:
        binding:
          text: =System.Conversation.Id
          text_1: =If(IsBlank(Global.Firmenname), "nicht angegeben", Global.Firmenname)
          text_2: =If(IsBlank(Global.Ansprechpartner), "nicht angegeben", Global.Ansprechpartner)
          text_3: =If(IsBlank(Global.Telefonnummer), "nicht angegeben", Global.Telefonnummer)
          text_4: =If(IsBlank(Global.AnrufgrundEN), "nicht angegeben", Text(Global.AnrufgrundEN))
          text_5: =If(IsBlank(Global.Anlage), "nicht erfasst", Global.Anlage)
          text_6: =If(IsBlank(Global.Anliegen), "nicht erfasst", Global.Anliegen)
          text_7: =If(IsBlank(Global.KanalLabel), "Telefon", Global.KanalLabel)

      output: {}
      flowId: a0a99959-80a7-f111-b8de-7ced8d476627

    - kind: Question
      id: question_Qt7GUF_en
      interruptionPolicy:
        allowInterruption: false

      variable: init:Topic.korrekt
      prompt:
        text:
          - |-
            Let me summarise your details:
            - Company: {Global.Firmenname}
            - Contact: {Global.Ansprechpartner}
            - Phone number: {Global.Telefonnummer}

            Is that correct?
        speak:
          - Let me summarise your details. You are calling for {Global.Firmenname}. Your name is {Global.Ansprechpartner} and we can reach you at {Global.TelefonGesprochen}. Is that correct?
        allowBargeIn: false

      entity: BooleanPrebuiltEntity
      voiceInputSettings:
        fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
        defaultValueMissingAction: GoToDialog

      fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

    - kind: ConditionGroup
      id: conditionGroup_lwSRiq_en
      conditions:
        - id: conditionItem_3i56ds_en
          condition: =Topic.korrekt = true
          actions:
            - kind: SetVariable
              id: setVariable_DCilYb_en
              variable: Global.FlowAufgerufen
              value: =true

            - kind: InvokeFlowAction
              id: invokeFlowAction_s8uOdc_en
              input:
                binding:
                  text: =Global.Firmenname
                  text_1: =Global.Ansprechpartner
                  text_2: =Global.Telefonnummer
                  text_3: =Global.Anliegen
                  text_4: =Global.KanalLabel
                  text_5: =Global.Anlage
                  text_6: =Text(Global.Anrufgrund)
                  text_7: =System.Conversation.Id

              output: {}
              flowId: 834c8025-3da8-f111-b8dd-70a8a52f67fc

            - kind: SendActivity
              id: dWynBC_en
              activity:
                text:
                  - Thank you. I have forwarded your request. A member of our team will contact you shortly. Goodbye.
                speak:
                  - Thank you. I have forwarded your request. A member of our team will contact you shortly. Goodbye!

            - kind: BeginDialog
              id: PWDKsD_en
              dialog: mosaiic_AIRCOTelefonBot.topic.EndofConversation

      elseActions:
        - kind: SetVariable
          id: setVariable_DQIEeM_en
          variable: Topic.Korrekturversuche
          value: =Topic.Korrekturversuche +1

        - kind: ConditionGroup
          id: conditionGroup_73xIxM_en
          conditions:
            - id: conditionItem_Ewz9wH_en
              condition: =Topic.Korrekturversuche <= 3
              displayName: Versuche =< 3
              actions:
                - kind: Question
                  id: question_ODxM04_en
                  interruptionPolicy:
                    allowInterruption: true

                  variable: init:Topic.Korrekturfeld
                  prompt:
                    text:
                      - Which detail was incorrect? The company name, the contact name, or the phone number?
                    speak:
                      - Which detail was incorrect? The company name, the contact name, or the phone number?

                  entity:
                    kind: ClosedListEntityReference
                    entityId: mosaiic_AIRCOTelefonBot.entity.Korrekturfeld

                  voiceInputSettings:
                    fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                    defaultValueMissingAction: GoToDialog

                  fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

                - kind: ConditionGroup
                  id: conditionGroup_7MJ9bT_en
                  conditions:
                    - id: conditionItem_kLZWTj_en
                      condition: =Topic.Korrekturfeld = 'mosaiic_AIRCOTelefonBot.entity.Korrekturfeld'.KJwQ9x
                      actions:
                        - kind: SetVariable
                          id: setVariable_EmKb6d_en
                          variable: Global.Firmenname
                          value: =Blank()

                        - kind: Question
                          id: question_UrXver_en
                          interruptionPolicy:
                            allowInterruption: true

                          variable: Global.Firmenname
                          prompt:
                            text:
                              - What is the correct company name?
                            speak:
                              - What is the correct company name?

                          entity:
                            kind: StringPrebuiltEntity
                            sensitivityLevel: None

                          voiceInputSettings:
                            fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                            defaultValueMissingAction: GoToDialog

                          fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

                    - id: conditionItem_33ZPed_en
                      condition: =Topic.Korrekturfeld = 'mosaiic_AIRCOTelefonBot.entity.Korrekturfeld'.md1vGC
                      actions:
                        - kind: SetVariable
                          id: setVariable_2nLyQe_en
                          variable: Global.Ansprechpartner
                          value: =Blank()

                        - kind: Question
                          id: question_sB1Ck1_en
                          interruptionPolicy:
                            allowInterruption: true

                          variable: Global.Ansprechpartner
                          prompt:
                            text:
                              - What is your correct name?
                            speak:
                              - What is your correct name?

                          entity: StringPrebuiltEntity
                          voiceInputSettings:
                            fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                            defaultValueMissingAction: GoToDialog

                          fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

                    - id: conditionItem_nV5Ax7_en
                      condition: =Topic.Korrekturfeld = 'mosaiic_AIRCOTelefonBot.entity.Korrekturfeld'.swLyyJ
                      actions:
                        - kind: SetVariable
                          id: setVariable_j62k3e_en
                          variable: Global.Telefonnummer
                          value: =Blank()

                        - kind: Question
                          id: question_Q8Yy2q_en
                          interruptionPolicy:
                            allowInterruption: true

                          variable: Global.Telefonnummer
                          prompt:
                            text:
                              - What is your correct phone number?
                            speak:
                              - What is your correct phone number?

                          entity: PhoneNumberPrebuiltEntity
                          voiceInputSettings:
                            fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                            defaultValueMissingAction: GoToDialog

                          fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

                        - kind: SetVariable
                          id: BrNrJj_en
                          variable: Global.TelefonGesprochen
                          value: |-
                            =Trim(
                                  Concat(
                                      Sequence(Len(Global.Telefonnummer)),
                                      Mid(Global.Telefonnummer, Value, 1) & " "
                                  )
                              )

                  elseActions:
                    - kind: SendActivity
                      id: sendActivity_zYNVAs_en
                      activity:
                        text:
                          - I'm sorry, I didn't understand that.
                        speak:
                          - I'm sorry, I didn't understand that.

                    - kind: GotoAction
                      id: rlmkpf_en
                      actionId: question_ODxM04_en

                - kind: GotoAction
                  id: SLfuCH_en
                  actionId: question_Qt7GUF_en

          elseActions:
            - kind: SetVariable
              id: g3K5c7_en
              variable: Global.FlowAufgerufen
              value: =true

            - kind: InvokeFlowAction
              id: zE6DJh_en
              input:
                binding:
                  text: =Global.Firmenname
                  text_1: =Global.Ansprechpartner
                  text_2: =Global.Telefonnummer
                  text_3: =Global.Anliegen
                  text_4: =Global.KanalLabel
                  text_5: =Global.Anlage
                  text_6: =Text(Global.Anrufgrund)
                  text_7: =System.Conversation.Id

              output: {}
              flowId: 834c8025-3da8-f111-b8dd-70a8a52f67fc

            - kind: SendActivity
              id: 5cXWgp_en
              activity:
                text:
                  - Unfortunately, your details could not be fully confirmed. I have forwarded your request. A member of our team will contact you shortly. Goodbye!
                speak:
                  - Unfortunately, your details could not be fully confirmed. I have forwarded your request. A member of our team will contact you shortly. Goodbye!

            - kind: BeginDialog
              id: Cs2X1Y_en
              dialog: mosaiic_AIRCOTelefonBot.topic.EndofConversation

inputType: {}
outputType: {}