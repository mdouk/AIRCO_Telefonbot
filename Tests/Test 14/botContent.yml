    displayName: Kundendaten erfassen EN
    id: 15cc1d18-52a6-428c-ba9c-bceb839cd5dc
    parentBotId: e90b2ac7-de81-f111-ab0e-7ced8d2d1a33
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg3d9837a5
    schemaName: mosaiic_AIRCOTelefonBot.topic.KundendatenerfassenEN
    dialog:
      beginDialog:
        kind: OnRedirect
        id: main
        actions:
          - kind: Question
            id: question_qMVPee_en
            interruptionPolicy:
              allowInterruption: false

            variable: Global.Firmenname
            prompt:
              text:
                - Which company are you calling for?
              speak:
                - Which company are you calling for?
              allowBargeIn: false

            entity: StringPrebuiltEntity
            voiceInputSettings:
              fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
              defaultValueMissingAction: GoToDialog

            fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

          - kind: Question
            id: question_H0ONs7_en
            interruptionPolicy:
              allowInterruption: false

            variable: Global.Ansprechpartner
            prompt:
              text:
                - May I have your name, please?
              speak:
                - May I have your name, please?
              allowBargeIn: false

            entity: StringPrebuiltEntity
            voiceInputSettings:
              fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
              defaultValueMissingAction: GoToDialog

            fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

          - kind: Question
            id: 9CvROV_en
            interruptionPolicy:
              allowInterruption: false

            variable: Global.Telefonnummer
            prompt:
              text:
                - At which number can we reach you?
              speak:
                - What is your phone number?
              allowBargeIn: false

            entity: PhoneNumberPrebuiltEntity
            voiceInputSettings:
              fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
              defaultValueMissingAction: GoToDialog

            fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

          - kind: SetVariable
            id: setVariable_dvKuWV_en
            variable: Global.TelefonGesprochen
            value: |-
              =Trim(
                    Concat(
                        Sequence(Len(Global.Telefonnummer)),
                        Mid(Global.Telefonnummer, Value, 1) & " "
                    )
                )

          - kind: Question
            id: U6OTmJ_en
            interruptionPolicy:
              allowInterruption: false

            variable: Global.AnrufgrundEN
            prompt:
              text:
                - |-
                  What is the reason for your call?
                  1 - Malfunction or problem
                  2 - Schedule a maintenance appointment
                  3 - Spare parts order
                  4 - Request a callback
                  5 - Something else
              speak:
                - "What is the reason for your call? You can say: malfunction or problem, schedule a maintenance appointment, spare parts order, request a callback, or something else."
              allowBargeIn: false

            entity:
              kind: ClosedListEntityReference
              sensitivityLevel: None
              entityId: mosaiic_AIRCOTelefonBot.entity.AnrufgrundEN

            voiceInputSettings:
              fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
              defaultValueMissingAction: GoToDialog

            fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

          - kind: SetVariable
            id: 2wyZbs_en
            variable: Global.KanalLabel
            value: Telefon

          - kind: ConditionGroup
            id: conditionGroup_DklHkA_en
            conditions:
              - id: conditionItem_8IyZXO_en
                condition: =Global.AnrufgrundEN = 'mosaiic_AIRCOTelefonBot.entity.AnrufgrundEN'.'8jiEHk' || Global.AnrufgrundEN = 'mosaiic_AIRCOTelefonBot.entity.AnrufgrundEN'.KXrpcq
                displayName: Störung oder Wartung > Anlage fragen
                actions:
                  - kind: Question
                    id: question_Xnm8Nm_en
                    interruptionPolicy:
                      allowInterruption: false

                    variable: Global.Anlage
                    prompt:
                      text:
                        - Please tell us the system designation, the serial number and the year of manufacture.
                      speak:
                        - Please tell us the system designation, the serial number and the year of manufacture.
                      allowBargeIn: false

                    entity:
                      kind: StringPrebuiltEntity
                      sensitivityLevel: None

                    voiceInputSettings:
                      fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
                      defaultValueMissingAction: GoToDialog

                    holdSettings:
                      kind: UserRequestedHoldSettings

                    fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

          - kind: InvokeFlowAction
            id: m8Ujcv_en
            displayName: Staging
            input:
              binding:
                text: =System.Conversation.Id
                text_1: =If(IsBlank(Global.Firmenname), "nicht angegeben", Global.Firmenname)
                text_2: =If(IsBlank(Global.Ansprechpartner), "nicht angegeben", Global.Ansprechpartner)
                text_3: =If(IsBlank(Global.Telefonnummer), "nicht angegeben", Global.Telefonnummer)
                text_4: =If(IsBlank(Global.AnrufgrundEN), "nicht angegeben", Text(Global.AnrufgrundEN))
                text_5: =If(IsBlank(Global.Anlage), "nicht erfasst", Global.Anlage)
                text_6: =If(IsBlank(Global.Anliegen), "nicht erfasst", Global.Anliegen)
                text_7: =If(IsBlank(Global.KanalLabel), "nicht angegeben", Global.KanalLabel)

            output: {}
            flowId: a0a99959-80a7-f111-b8de-7ced8d476627

          - kind: Question
            id: question_RZHeKB_en
            interruptionPolicy:
              allowInterruption: false

            variable: Global.Anliegen
            prompt:
              text:
                - Please describe your request now.
              speak:
                - Please describe your request now.
              allowBargeIn: false

            entity: StringPrebuiltEntity
            voiceInputSettings:
              fallbackDialogOnSilence: mosaiic_AIRCOTelefonBot.topic.EndofConversation
              defaultValueMissingAction: GoToDialog

            fallbackDialogOnInvalidEntity: mosaiic_AIRCOTelefonBot.topic.EndofConversation

          - kind: BeginDialog
            id: uFP7SX_en
            dialog: mosaiic_AIRCOTelefonBot.topic.ZusammenfassungEN

      inputType: {}
      outputType: {}

