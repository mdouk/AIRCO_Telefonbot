    displayName: Bei Fehler
    id: 3ca2b800-40c3-429b-9a83-05ac79a30707
    parentBotId: e90b2ac7-de81-f111-ab0e-7ced8d2d1a33
    description: Dieses Systemthema wird ausgelöst, wenn der Agent auf einen Fehler stößt. Bei Verwendung des Test-Chatbereichs wird die vollständige Fehlerbeschreibung angezeigt.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg3d9837a5
    schemaName: mosaiic_AIRCOTelefonBot.topic.OnError
    dialog:
      startBehavior: UseLatestPublishedContentAndCancelOtherTopics
      beginDialog:
        kind: OnError
        id: main
        actions:
          - kind: SetVariable
            id: setVariable_timestamp
            variable: init:Topic.CurrentTime
            value: =Text(Now(), DateTimeFormat.UTC)

          - kind: ConditionGroup
            id: condition_1
            conditions:
              - id: bL4wmY
                condition: =System.Conversation.InTestMode = true
                actions:
                  - kind: SendActivity
                    id: sendMessage_XJBYMo
                    activity:
                      text:
                        - |-
                          Fehlermeldung: {System.Error.Message}
                          Fehlercode: {System.Error.Code}
                          Unterhaltungs-ID: {System.Conversation.Id}
                          Zeit (UTC): {Topic.CurrentTime}
                      speak:
                        - Es tut uns leid, es ist ein technischer Fehler aufgetreten. Bitte versuchen Sie es später erneut. Auf Wiederhören.

            elseActions:
              - kind: SendActivity
                id: sendMessage_dZ0gaF
                activity:
                  text:
                    - |-
                      Ein Fehler ist aufgetreten.
                      Fehlercode: {System.Error.Code}
                      Unterhaltungs-ID: {System.Conversation.Id}
                      Zeit (UTC): {Topic.CurrentTime}.
                  speak:
                    - Es tut uns leid, es ist ein technischer Fehler aufgetreten. Ihr Anliegen wurde gespeichert und ein Mitarbeiter wird sich bei Ihnen melden. Auf Wiederhören.

          - kind: LogCustomTelemetryEvent
